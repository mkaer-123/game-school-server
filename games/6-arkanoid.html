<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Arkanoid</title><style>body{margin:0;padding:20px;background:#1a0a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial;}canvas{border:2px solid #ff00ff;background:#000;display:block;}#info{color:#ff00ff;text-align:center;margin-top:20px;}</style></head><body><div><canvas id="gc" width="800" height="600"></canvas><div id="info"><h2>Arkanoid</h2><p>Advanced brick breaker with power-ups!</p><p id="s">Score: 0</p></div></div><script>const c=document.getElementById('gc');const x=c.getContext('2d');const g={w:800,h:600,s:0,l:3};const p={x:g.w/2-50,y:g.h-30,w:100,h:15};const b={x:g.w/2,y:g.h-50,r:6,dx:3,dy:-3};const bk=[];const pw=[];let mo=g.w/2;for(let i=0;i<5;i++)for(let j=0;j<8;j++)bk.push({x:j*90+20,y:i*30+30,w:80,h:25,a:1});document.addEventListener('mousemove',(e)=>mo=e.clientX-c.getBoundingClientRect().left);setInterval(()=>{p.x=Math.max(0,Math.min(g.w-p.w,mo-p.w/2));b.x+=b.dx;b.y+=b.dy;if(b.x-b.r<0||b.x+b.r>g.w)b.dx=-b.dx;if(b.y-b.r<0)b.dy=-b.dy;if(b.y-b.r>g.h){g.l--;if(g.l<0)alert('Game Over! '+g.s);else{b.x=g.w/2;b.y=g.h-50;}}if(b.x>p.x&&b.x<p.x+p.w&&b.y+b.r>p.y&&b.y+b.r<p.y+p.h)b.dy=-b.dy;for(let i=bk.length-1;i>=0;i--){if(bk[i].a&&b.x>bk[i].x&&b.x<bk[i].x+bk[i].w&&b.y>bk[i].y&&b.y<bk[i].y+bk[i].h){b.dy=-b.dy;bk[i].a=0;g.s+=50;if(Math.random()<0.3)pw.push({x:bk[i].x,y:bk[i].y,t:1})}}for(let i=pw.length-1;i>=0;i--){pw[i].y+=2;if(pw[i].y>g.h)pw.splice(i,1);else if(pw[i].x>p.x&&pw[i].x<p.x+p.w&&pw[i].y>p.y&&pw[i].y<p.y+p.h){if(pw[i].t===1)p.w=Math.min(150,p.w+30);pw.splice(i,1);}}},30);setInterval(()=>{x.fillStyle='#000';x.fillRect(0,0,g.w,g.h);x.fillStyle='#ff00ff';for(let bri of bk)if(bri.a)x.fillRect(bri.x,bri.y,bri.w,bri.h);x.fillStyle='#0ff';x.fillRect(p.x,p.y,p.w,p.h);x.beginPath();x.arc(b.x,b.y,b.r,0,6.28);x.fill();for(let pr of pw){x.fillStyle='#ffff00';x.fillRect(pr.x,pr.y,10,10);}x.fillStyle='#0f0';x.font='20px Arial';x.fillText('Score: '+g.s,20,30);},30);</script></body></html>
