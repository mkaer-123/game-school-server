<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Ball Bounce</title><style>body{margin:0;padding:20px;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;}canvas{border:2px solid #fff;background:#000;display:block;}#info{color:#fff;text-align:center;margin-top:20px;}</style></head><body><div><canvas id="gc" width="600" height="400"></canvas><div id="info"><h2>Ball Bounce</h2><p>Keep the ball in play!</p><p id="s">Time: 0s</p></div></div><script>const c=document.getElementById('gc');const x=c.getContext('2d');const g={w:600,h:400,t:0};const p={x:g.w/2-40,y:g.h-30,w:80,h:15};const b={x:g.w/2,y:g.h-50,r:8,dx:2,dy:-3};document.addEventListener('mousemove',(e)=>p.x=Math.max(0,Math.min(g.w-p.w,e.clientX-c.getBoundingClientRect().left-p.w/2)));setInterval(()=>{g.t++;b.x+=b.dx;b.y+=b.dy;if(b.x-b.r<0||b.x+b.r>g.w)b.dx=-b.dx;if(b.y-b.r<0)b.dy=-b.dy;if(b.y-b.r>g.h)alert('Game Over! Time: '+g.t+'s');else if(b.x>p.x&&b.x<p.x+p.w&&b.y+b.r>p.y)b.dy=-Math.abs(b.dy);document.getElementById('s').textContent='Time: '+g.t+'s';},1000);setInterval(()=>{x.fillStyle='#000';x.fillRect(0,0,g.w,g.h);x.fillStyle='#fff';x.fillRect(p.x,p.y,p.w,p.h);x.beginPath();x.arc(b.x,b.y,b.r,0,6.28);x.fill();},30);</script></body></html>
