<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Power Paddle</title><style>body{margin:0;padding:20px;background:#333;display:flex;justify-content:center;align-items:center;min-height:100vh;}canvas{border:2px solid #0f0;background:#000;display:block;}#info{color:#0f0;text-align:center;margin-top:20px;}</style></head><body><div><canvas id="gc" width="700" height="500"></canvas><div id="info"><h2>Power Paddle</h2><p>Collect power-ups with your paddle!</p><p id="s">Score: 0</p></div></div><script>const c=document.getElementById('gc');const x=c.getContext('2d');const g={w:700,h:500,sc:0};const p={x:g.w/2-50,y:g.h-40,w:100,h:20};const pw=[];for(let i=0;i<10;i++)pw.push({x:Math.random()*(g.w-20),y:Math.random()*(g.h-200),w:20,h:20,dy:2});document.addEventListener('mousemove',(e)=>p.x=Math.max(0,Math.min(g.w-p.w,e.clientX-c.getBoundingClientRect().left-p.w/2)));setInterval(()=>{for(let i=pw.length-1;i>=0;i--){pw[i].y+=pw[i].dy;if(pw[i].y>g.h){pw.splice(i,1);}else if(pw[i].x<p.x+p.w&&pw[i].x+pw[i].w>p.x&&pw[i].y+pw[i].h>p.y){g.sc+=50;pw.splice(i,1);}if(pw.length<5)pw.push({x:Math.random()*(g.w-20),y:-20,w:20,h:20,dy:2+Math.random()*2});}document.getElementById('s').textContent='Score: '+g.sc;},50);setInterval(()=>{x.fillStyle='#000';x.fillRect(0,0,g.w,g.h);x.fillStyle='#0f0';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#ffff00';for(let po of pw)x.fillRect(po.x,po.y,po.w,po.h);},50);</script></body></html>
