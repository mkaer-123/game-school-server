<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Ultra Pong</title><style>body{margin:0;padding:20px;background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;}canvas{border:3px solid #ff00ff;background:#000;display:block;}#info{color:#ff00ff;text-align:center;margin-top:20px;}</style></head><body><div><canvas id="gc" width="1000" height="600"></canvas><div id="info"><h2>Ultra Pong - 4 Players!</h2><p id="s">Scores: 0 | 0 | 0 | 0</p></div></div><script>const c=document.getElementById('gc');const x=c.getContext('2d');const g={w:1000,h:600,s:[0,0,0,0]};const p=[{x:20,y:250,w:15,h:100},{x:g.w-35,y:250,w:15,h:100},{x:450,y:20,w:100,h:15},{x:450,y:g.h-35,w:100,h:15}];const b={x:g.w/2,y:g.h/2,r:8,dx:4,dy:3};const k={};window.addEventListener('keydown',(e)=>k[e.key]=1);window.addEventListener('keyup',(e)=>k[e.key]=0);setInterval(()=>{if(k['w'])p[0].y=Math.max(0,p[0].y-5);if(k['s'])p[0].y=Math.min(g.h-p[0].h,p[0].y+5);if(k['ArrowUp'])p[1].y=Math.max(0,p[1].y-5);if(k['ArrowDown'])p[1].y=Math.min(g.h-p[1].h,p[1].y+5);if(k['a'])p[2].x=Math.max(0,p[2].x-5);if(k['d'])p[2].x=Math.min(g.w-p[2].w,p[2].x+5);if(k['ArrowLeft'])p[3].x=Math.max(0,p[3].x-5);if(k['ArrowRight'])p[3].x=Math.min(g.w-p[3].w,p[3].x+5);b.x+=b.dx;b.y+=b.dy;if(b.x-b.r<0||b.x+b.r>g.w)b.dx=-b.dx;if(b.y-b.r<0||b.y+b.r>g.h)b.dy=-b.dy;for(let i=0;i<4;i++){if(i<2){if(b.x-b.r<(i===0?p[i].x+p[i].w:p[i].x)&&b.x>p[i].x-b.r&&b.y>p[i].y&&b.y<p[i].y+p[i].h)b.dx=-b.dx;}else{if(b.y-b.r<(i===2?p[i].y+p[i].h:p[i].y)&&b.y>p[i].y-b.r&&b.x>p[i].x&&b.x<p[i].x+p[i].w)b.dy=-b.dy;}}document.getElementById('s').textContent=`Scores: ${g.s[0]} | ${g.s[1]} | ${g.s[2]} | ${g.s[3]}`;},30);setInterval(()=>{x.fillStyle='#000';x.fillRect(0,0,g.w,g.h);x.fillStyle='#ff00ff';for(let pd of p)x.fillRect(pd.x,pd.y,pd.w,pd.h);x.beginPath();x.arc(b.x,b.y,b.r,0,6.28);x.fill();},30);</script></body></html>
