<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Paddle Defense</title><style>body{margin:0;padding:20px;background:#0a0a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;}canvas{border:2px solid #00ff00;background:#000;display:block;}#info{color:#00ff00;text-align:center;margin-top:20px;}</style></head><body><div><canvas id="gc" width="800" height="600"></canvas><div id="info"><h2>Paddle Defense</h2><p>Defend against falling blocks!</p><p id="s">Health: 100</p></div></div><script>const c=document.getElementById('gc');const x=c.getContext('2d');const g={w:800,h:600,hp:100};const p={x:g.w/2-60,y:g.h-40,w:120,h:20};const b=[];for(let i=0;i<3;i++)b.push({x:Math.random()*(g.w-40),y:Math.random()*200-200,w:40,h:40,dy:2});document.addEventListener('mousemove',(e)=>p.x=Math.max(0,Math.min(g.w-p.w,e.clientX-c.getBoundingClientRect().left-p.w/2)));setInterval(()=>{for(let i=b.length-1;i>=0;i--){b[i].y+=b[i].dy;if(b[i].y>g.h){g.hp-=10;b.splice(i,1);if(g.hp<=0)alert('Game Over!');else b.push({x:Math.random()*(g.w-40),y:-40,w:40,h:40,dy:2+Math.random()*2});}else if(b[i].x<p.x+p.w&&b[i].x+b[i].w>p.x&&b[i].y+b[i].h>p.y){b.splice(i,1);b.push({x:Math.random()*(g.w-40),y:-40,w:40,h:40,dy:2+Math.random()*2});}document.getElementById('s').textContent='Health: '+g.hp;}},30);setInterval(()=>{x.fillStyle='#000';x.fillRect(0,0,g.w,g.h);x.fillStyle='#00ff00';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#ff0000';for(let bl of b)x.fillRect(bl.x,bl.y,bl.w,bl.h);},30);</script></body></html>
