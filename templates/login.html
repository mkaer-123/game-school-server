<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Games - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Press Start 2P', 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        
        .login-container {
            background: rgba(22, 33, 62, 0.9);
            border: 4px solid #00ff88;
            padding: 40px 50px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
            animation: fadeIn 0.6s ease;
        }
        
        .login-container h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 30px;
            font-size: 1.5em;
            text-shadow: 0 0 10px #00ff88;
            letter-spacing: 2px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            color: #00ffff;
            margin-bottom: 8px;
            font-size: 0.9em;
            text-shadow: 0 0 5px #00ffff;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #00ff88;
            background: rgba(0, 255, 136, 0.05);
            color: #00ff88;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8em;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 15px #00ff88;
            background: rgba(0, 255, 136, 0.15);
        }
        
        .form-group input::placeholder {
            color: rgba(0, 255, 136, 0.5);
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            border: 2px solid #00ff88;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        
        .login-btn:hover {
            background: #00ff88;
            color: #1a1a2e;
            box-shadow: 0 0 15px #00ff88;
            transform: scale(1.05);
        }
        
        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            color: #ff6666;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.8em;
            display: none;
            text-align: center;
        }
        
        .info {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 15px;
            font-size: 0.75em;
            line-height: 1.6;
        }
        
        .info h3 {
            color: #00ff88;
            margin-bottom: 10px;
            font-size: 0.9em;
        }
        
        .accounts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        
        .account-item {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid #00ffff;
            padding: 8px;
            text-align: center;
            font-size: 0.7em;
        }
        
        .account-name {
            color: #00ff88;
            font-weight: bold;
        }
        
        .account-password {
            color: #ffff00;
            margin-top: 5px;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #00ff88;
            margin-top: 15px;
            animation: blink 1s infinite;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }
            
            .login-container h1 {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>👾 LOGIN 👾</h1>
        
        <div class="error" id="errorMsg"></div>
        
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">USERNAME</label>
                <input type="text" id="username" placeholder="player1-player10" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" placeholder="Changes monthly!" required autocomplete="off">
            </div>
            
            <button type="submit" class="login-btn">ENTER ARCADE</button>
        </form>
        
        <div class="loading" id="loading">CONNECTING...</div>
        
        <div class="info">
            <h3>▸ AVAILABLE ACCOUNTS:</h3>
            <div class="accounts">
                <div class="account-item">
                    <div class="account-name">Player 1</div>
                    <div class="account-password" id="pwd1"></div>
                </div>
                <div class="account-item">
                    <div class="account-name">Player 2</div>
                    <div class="account-password" id="pwd2"></div>
                </div>
                <div class="account-item">
                    <div class="account-name">Player 3</div>
                    <div class="account-password" id="pwd3"></div>
                </div>
                <div class="account-item">
                    <div class="account-name">Player 4</div>
                    <div class="account-password" id="pwd4"></div>
                </div>
                <div class="account-item">
                    <div class="account-name">Player 5</div>
                    <div class="account-password" id="pwd5"></div>
                </div>
                <div class="account-item">
                    <div class="account-name">Player 6</div>
                    <div class="account-password" id="pwd6"></div>
                </div>
                <div class="account-item">
                    <div class="account-name">Player 7</div>
                    <div class="account-password" id="pwd7"></div>
                </div>
                <div class="account-item">
                    <div class="account-name">Player 8</div>
                    <div class="account-password" id="pwd8"></div>
                </div>
                <div class="account-item">
                    <div class="account-name">Player 9</div>
                    <div class="account-password" id="pwd9"></div>
                </div>
                <div class="account-item">
                    <div class="account-name">Player 10</div>
                    <div class="account-password" id="pwd10"></div>
                </div>
            </div>
            
            <div style="margin-top: 15px; border-top: 1px solid #00ffff; padding-top: 10px;">
                ▸ PASSWORD CHANGES EACH MONTH<br>
                ▸ START WITH 1000 GEMS<br>
                ▸ UNLOCK MORE GAMES
            </div>
        </div>
    </div>
    
    <script>
        // Display passwords on load
        function displayPasswords() {
            for (let i = 1; i <= 10; i++) {
                const username = `player${i}`;
                const password = generateMonthlyPassword(username);
                document.getElementById(`pwd${i}`).textContent = password;
            }
        }
        
        function generateMonthlyPassword(username) {
            const month = new Date().toISOString().slice(0, 7);
            const crypto = window.crypto || window.msCrypto;
            
            // Simple hash function (matches server logic)
            const seed = `${username}_${month}_arcade_secret`;
            
            // Create a simple hash
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                const char = seed.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32bit integer
            }
            
            // Convert to hex and take first 10 chars, uppercase
            return Math.abs(hash).toString(16).substring(0, 10).toUpperCase();
        }
        
        // Display passwords on page load
        window.addEventListener('load', displayPasswords);
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.toLowerCase();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const loading = document.getElementById('loading');
            
            errorMsg.style.display = 'none';
            loading.style.display = 'block';
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    const data = await response.json();
                    errorMsg.textContent = data.error || 'Login failed. Try again!';
                    errorMsg.style.display = 'block';
                    loading.style.display = 'none';
                }
            } catch (error) {
                errorMsg.textContent = 'Connection error. Make sure server is running!';
                errorMsg.style.display = 'block';
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
