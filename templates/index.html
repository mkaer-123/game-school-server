<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Games Server - 100 Games!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease;
        }
        
        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.6s ease;
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        
        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #764ba2;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #6a3f8f;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
        }
        
        .games-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .game-item {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .game-item:hover {
            background: #edf2f7;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .game-item .id {
            font-weight: 700;
            color: #667eea;
            font-size: 1.2em;
        }
        
        .game-item .name {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        
        .game-item .difficulty {
            font-size: 0.75em;
            margin-top: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        
        .difficulty.easy { background: #c6f6d5; color: #22543d; }
        .difficulty.medium { background: #feebc8; color: #7c2d12; }
        .difficulty.hard { background: #fed7d7; color: #742a2a; }
        .difficulty.expert { background: #e6fffa; color: #234e52; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-box {
            background: #edf2f7;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-box .number {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }
        
        .stat-box .label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .chatbot {
            display: flex;
            flex-direction: column;
            max-height: 500px;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
        }
        
        .message {
            margin-bottom: 12px;
            padding: 10px 15px;
            border-radius: 8px;
            animation: slideUp 0.3s ease;
        }
        
        .message.user {
            background: #667eea;
            color: white;
            margin-left: 20px;
            text-align: right;
        }
        
        .message.ai {
            background: #e2e8f0;
            color: #333;
            margin-right: 20px;
        }
        
        .chat-input-group {
            display: flex;
            gap: 10px;
        }
        
        .chat-input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
        }
        
        .chat-input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .filter-section {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        select {
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95em;
            cursor: pointer;
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease;
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .close {
            color: #999;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            float: right;
        }
        
        .close:hover {
            color: #333;
        }
        
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 2em;
            }
            
            .games-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Shape Games Server</h1>
            <p>100 Amazing Shape-Based Games | Powered by Ollama AI</p>
        </header>
        
        <div class="main-grid">
            <!-- Games Section -->
            <div class="card">
                <h2>🎯 Games Library</h2>
                
                <div class="filter-section">
                    <select id="typeFilter">
                        <option value="">All Types</option>
                        <option value="pattern">Pattern Recognition</option>
                        <option value="color">Color & Shapes</option>
                        <option value="speed">Speed & Precision</option>
                        <option value="geometry">Geometry & Math</option>
                        <option value="identification">Shape ID</option>
                        <option value="rotation">Rotation</option>
                        <option value="logic">Puzzle & Logic</option>
                        <option value="creative">Drawing & Creation</option>
                        <option value="memory">Memory</option>
                        <option value="multiplayer">Multiplayer</option>
                    </select>
                    
                    <select id="difficultyFilter">
                        <option value="">All Difficulties</option>
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                        <option value="expert">Expert</option>
                    </select>
                </div>
                
                <div class="buttons-grid">
                    <button class="btn-primary" onclick="randomGame()">🎲 Random Game</button>
                    <button class="btn-secondary" onclick="loadAllGames()">📚 All Games</button>
                </div>
                
                <div class="games-list" id="gamesList"></div>
                
                <div class="stats" id="stats"></div>
            </div>
            
            <!-- AI Chatbot Section -->
            <div class="card">
                <h2>🤖 AI Gaming Assistant</h2>
                <p style="font-size: 0.9em; color: #999; margin-bottom: 15px;">Chat with Ollama AI for game tips, recommendations & strategies!</p>
                
                <div class="chatbot">
                    <div class="chat-messages" id="chatMessages">
                        <div class="message ai">
                            👋 Hi! I'm your AI gaming assistant. Ask me about game recommendations, tips, or strategies!
                        </div>
                    </div>
                    
                    <div class="chat-input-group">
                        <input type="text" id="chatInput" placeholder="Ask me anything about the games..." onkeypress="handleChatKey(event)">
                        <button class="btn-primary" onclick="sendMessage()" style="flex: 0;">Send</button>
                    </div>
                </div>
                
                <button class="btn-secondary" onclick="clearChat()" style="width: 100%; margin-top: 15px;">Clear Chat</button>
            </div>
        </div>
    </div>
    
    <!-- Game Detail Modal -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle"></h2>
            <p><strong>Type:</strong> <span id="modalType"></span></p>
            <p><strong>Difficulty:</strong> <span id="modalDifficulty"></span></p>
            <p id="modalDescription"></p>
            <button class="btn-success" style="width: 100%; margin-top: 20px;" onclick="playGame()">▶️ Play Game</button>
        </div>
    </div>
    
    <script>
        // Load all games on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadAllGames();
            loadStats();
        });
        
        // Filter games
        document.getElementById('typeFilter').addEventListener('change', applyFilters);
        document.getElementById('difficultyFilter').addEventListener('change', applyFilters);
        
        async function loadAllGames() {
            try {
                const response = await fetch('/api/games');
                const games = await response.json();
                displayGames(games);
            } catch (error) {
                console.error('Error loading games:', error);
            }
        }
        
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                
                let html = `
                    <div class="stat-box">
                        <div class="number">${stats.total_games}</div>
                        <div class="label">Total Games</div>
                    </div>
                `;
                
                for (let [type, count] of Object.entries(stats.types)) {
                    html += `
                        <div class="stat-box">
                            <div class="number">${count}</div>
                            <div class="label">${type.charAt(0).toUpperCase() + type.slice(1)}</div>
                        </div>
                    `;
                }
                
                document.getElementById('stats').innerHTML = html;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        async function randomGame() {
            try {
                const response = await fetch('/api/games/random');
                const game = await response.json();
                showGameModal(game.id, game);
            } catch (error) {
                console.error('Error loading random game:', error);
            }
        }
        
        async function applyFilters() {
            const type = document.getElementById('typeFilter').value;
            const difficulty = document.getElementById('difficultyFilter').value;
            
            let url = '/api/games/filter';
            const params = new URLSearchParams();
            if (type) params.append('type', type);
            if (difficulty) params.append('difficulty', difficulty);
            
            try {
                const response = await fetch(url + '?' + params.toString());
                const games = await response.json();
                displayGames(games);
            } catch (error) {
                console.error('Error filtering games:', error);
            }
        }
        
        function displayGames(games) {
            const gamesList = document.getElementById('gamesList');
            let html = '';
            
            for (let [id, game] of Object.entries(games)) {
                html += `
                    <div class="game-item" onclick="showGameModal(${id}, ${JSON.stringify(game)})">
                        <div class="id">#${id}</div>
                        <div class="name">${game.name}</div>
                        <div class="difficulty ${game.difficulty}">${game.difficulty}</div>
                    </div>
                `;
            }
            
            gamesList.innerHTML = html;
        }
        
        function showGameModal(id, game) {
            document.getElementById('modalTitle').textContent = `${game.name} (#${id})`;
            document.getElementById('modalType').textContent = game.type.charAt(0).toUpperCase() + game.type.slice(1);
            document.getElementById('modalDifficulty').textContent = game.difficulty.toUpperCase();
            document.getElementById('modalDescription').textContent = `Get ready to play ${game.name}! This ${game.difficulty} level game focuses on ${game.type} skills.`;
            document.getElementById('gameModal').style.display = 'block';
        }
        
        function closeModal() {
            document.getElementById('gameModal').style.display = 'none';
        }
        
        function playGame() {
            alert('🎮 Game launching! The actual game would load here.');
            closeModal();
        }
        
        // Chatbot functions
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message to chat
            addMessage(message, 'user');
            input.value = '';
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                addMessage(data.response, 'ai');
            } catch (error) {
                addMessage('⚠️ Error connecting to AI. Make sure Ollama is running!', 'ai');
            }
        }
        
        function handleChatKey(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        function addMessage(text, sender) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        async function clearChat() {
            try {
                await fetch('/api/chat/clear', { method: 'POST' });
                document.getElementById('chatMessages').innerHTML = `
                    <div class="message ai">
                        👋 Hi! I'm your AI gaming assistant. Ask me about game recommendations, tips, or strategies!
                    </div>
                `;
            } catch (error) {
                console.error('Error clearing chat:', error);
            }
        }
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('gameModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
