<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Games Server - 100 Classic Games!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Press Start 2P', 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            color: #00ff88;
            margin-bottom: 40px;
            animation: glitch 0.6s ease;
            text-shadow: 0 0 10px #00ff88;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        
        header p {
            font-size: 0.8em;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: rgba(22, 33, 62, 0.8);
            border: 3px solid #00ff88;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            animation: fadeIn 0.6s ease;
        }
        
        .card h2 {
            color: #00ff88;
            margin-bottom: 15px;
            border-bottom: 2px solid #00ff88;
            padding-bottom: 10px;
            font-size: 1.2em;
            text-shadow: 0 0 10px #00ff88;
        }
        
        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        button {
            padding: 10px 15px;
            border: 2px solid #00ff88;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        
        button:hover {
            background: #00ff88;
            color: #1a1a2e;
            box-shadow: 0 0 10px #00ff88;
            transform: scale(1.05);
        }
        
        .games-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 15px;
            max-height: 350px;
            overflow-y: auto;
        }
        
        .game-item {
            background: rgba(0, 255, 136, 0.05);
            padding: 10px;
            border: 2px solid #00ffff;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 0.7em;
        }
        
        .game-item:hover {
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 10px #00ffff;
            border-color: #00ff88;
        }
        
        .game-item .id {
            font-weight: 700;
            color: #ff00ff;
            font-size: 1.1em;
        }
        
        .game-item .name {
            color: #00ff88;
            margin: 5px 0;
        }
        
        .difficulty {
            font-size: 0.65em;
            padding: 3px 5px;
            display: inline-block;
            margin-top: 5px;
            border: 1px solid;
        }
        
        .difficulty.easy { border-color: #00ff88; color: #00ff88; }
        .difficulty.medium { border-color: #ffff00; color: #ffff00; }
        .difficulty.hard { border-color: #ff6600; color: #ff6600; }
        .difficulty.expert { border-color: #ff0000; color: #ff0000; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .stat-box {
            background: rgba(0, 255, 136, 0.1);
            padding: 10px;
            border: 2px solid #00ffff;
            text-align: center;
            font-size: 0.7em;
        }
        
        .stat-box .number {
            font-size: 1.5em;
            font-weight: 700;
            color: #00ff88;
        }
        
        .stat-box .label {
            color: #00ffff;
            margin-top: 5px;
        }
        
        .chatbot {
            display: flex;
            flex-direction: column;
            max-height: 450px;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            background: rgba(0, 255, 136, 0.05);
            padding: 10px;
            border: 2px solid #00ffff;
        }
        
        .message {
            margin-bottom: 8px;
            padding: 8px 10px;
            font-size: 0.7em;
            animation: slideUp 0.3s ease;
        }
        
        .message.user {
            background: rgba(255, 0, 255, 0.2);
            color: #ff00ff;
            border-left: 3px solid #ff00ff;
            text-align: right;
        }
        
        .message.ai {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border-left: 3px solid #00ff88;
        }
        
        .chat-input-group {
            display: flex;
            gap: 5px;
        }
        
        .chat-input-group input {
            flex: 1;
            padding: 8px 10px;
            border: 2px solid #00ff88;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7em;
        }
        
        .chat-input-group input::placeholder {
            color: rgba(0, 255, 136, 0.5);
        }
        
        .chat-input-group input:focus {
            outline: none;
            box-shadow: 0 0 10px #00ff88;
        }
        
        .filter-section {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            font-size: 0.8em;
        }
        
        select {
            padding: 8px 10px;
            border: 2px solid #00ff88;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7em;
            cursor: pointer;
        }
        
        select:focus {
            outline: none;
            box-shadow: 0 0 10px #00ff88;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }
        
        .modal-content {
            background: #1a1a2e;
            border: 3px solid #00ff88;
            margin: 10% auto;
            padding: 20px;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        
        .modal-content h2 {
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        .modal-content p {
            color: #00ffff;
            font-size: 0.8em;
            margin: 10px 0;
        }
        
        .close {
            color: #00ff88;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            float: right;
        }
        
        .close:hover {
            color: #ff00ff;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 255, 136, 0.1);
        }
        
        ::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #00ffff;
        }
        
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.5em;
            }
            
            .games-list {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
        
        @keyframes glitch {
            0% { text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff; }
            100% { text-shadow: 0 0 #00ff88; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👾 ARCADE GAMES 👾</h1>
            <p>100 Classic Arcade Games | Powered by Ollama AI</p>
        </header>
        
        <div class="main-grid">
            <!-- Games Section -->
            <div class="card">
                <h2>🎮 GAMES LIBRARY</h2>
                
                <div class="filter-section">
                    <select id="typeFilter">
                        <option value="">ALL TYPES</option>
                        <option value="paddle">Paddle</option>
                        <option value="movement">Movement</option>
                        <option value="shooter">Shooter</option>
                        <option value="arcade">Arcade</option>
                        <option value="puzzle">Puzzle</option>
                        <option value="racing">Racing</option>
                        <option value="platform">Platform</option>
                        <option value="multiplayer">Multiplayer</option>
                        <option value="special">Special</option>
                    </select>
                    
                    <select id="difficultyFilter">
                        <option value="">ALL DIFFICULTY</option>
                        <option value="easy">EASY</option>
                        <option value="medium">MEDIUM</option>
                        <option value="hard">HARD</option>
                        <option value="expert">EXPERT</option>
                    </select>
                </div>
                
                <div class="buttons-grid">
                    <button onclick="randomGame()">🎲 RANDOM</button>
                    <button onclick="loadAllGames()">📚 ALL GAMES</button>
                </div>
                
                <div class="games-list" id="gamesList"></div>
                
                <div class="stats" id="stats"></div>
            </div>
            
            <!-- AI Chatbot Section -->
            <div class="card">
                <h2>🤖 AI ARCADE BUDDY</h2>
                
                <div class="chatbot">
                    <div class="chat-messages" id="chatMessages">
                        <div class="message ai">
                            > ARCADE BUDDY ONLINE<br>
                            > READY TO HELP!<br>
                            > ASK ME ANYTHING 👾
                        </div>
                    </div>
                    
                    <div class="chat-input-group">
                        <input type="text" id="chatInput" placeholder="Your question..." onkeypress="handleChatKey(event)">
                        <button onclick="sendMessage()" style="flex: 0; width: 80px;">SEND</button>
                    </div>
                </div>
                
                <button onclick="clearChat()" style="width: 100%; margin-top: 10px;">CLEAR</button>
            </div>
        </div>
    </div>
    
    <!-- Game Detail Modal -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle"></h2>
            <p><strong>▸ TYPE:</strong> <span id="modalType"></span></p>
            <p><strong>▸ DIFFICULTY:</strong> <span id="modalDifficulty"></span></p>
            <p id="modalDescription"></p>
            <button onclick="playGame()" style="width: 100%; margin-top: 15px;">▶ PLAY NOW</button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadAllGames();
            loadStats();
        });
        
        document.getElementById('typeFilter').addEventListener('change', applyFilters);
        document.getElementById('difficultyFilter').addEventListener('change', applyFilters);
        
        async function loadAllGames() {
            try {
                const response = await fetch('/api/games');
                const games = await response.json();
                displayGames(games);
            } catch (error) {
                console.error('Error loading games:', error);
            }
        }
        
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                
                let html = `
                    <div class="stat-box">
                        <div class="number">${stats.total_games}</div>
                        <div class="label">GAMES</div>
                    </div>
                `;
                
                for (let [type, count] of Object.entries(stats.types)) {
                    html += `
                        <div class="stat-box">
                            <div class="number">${count}</div>
                            <div class="label">${type.toUpperCase()}</div>
                        </div>
                    `;
                }
                
                document.getElementById('stats').innerHTML = html;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        async function randomGame() {
            try {
                const response = await fetch('/api/games/random');
                const game = await response.json();
                showGameModal(game.id, game);
            } catch (error) {
                console.error('Error loading random game:', error);
            }
        }
        
        async function applyFilters() {
            const type = document.getElementById('typeFilter').value;
            const difficulty = document.getElementById('difficultyFilter').value;
            
            let url = '/api/games/filter';
            const params = new URLSearchParams();
            if (type) params.append('type', type);
            if (difficulty) params.append('difficulty', difficulty);
            
            try {
                const response = await fetch(url + '?' + params.toString());
                const games = await response.json();
                displayGames(games);
            } catch (error) {
                console.error('Error filtering games:', error);
            }
        }
        
        function displayGames(games) {
            const gamesList = document.getElementById('gamesList');
            let html = '';
            
            for (let [id, game] of Object.entries(games)) {
                html += `
                    <div class="game-item" onclick="showGameModal(${id}, ${JSON.stringify(game)})">
                        <div class="id">#${id}</div>
                        <div class="name">${game.name}</div>
                        <div class="difficulty ${game.difficulty}">${game.difficulty.toUpperCase()}</div>
                    </div>
                `;
            }
            
            gamesList.innerHTML = html;
        }
        
        function showGameModal(id, game) {
            document.getElementById('modalTitle').textContent = `${game.name} (#${id})`;
            document.getElementById('modalType').textContent = game.type.toUpperCase();
            document.getElementById('modalDifficulty').textContent = game.difficulty.toUpperCase();
            document.getElementById('modalDescription').textContent = game.description;
            document.getElementById('gameModal').style.display = 'block';
        }
        
        function closeModal() {
            document.getElementById('gameModal').style.display = 'none';
        }
        
        function playGame() {
            alert('🎮 LAUNCHING GAME...\n\nThe actual game would load here!');
            closeModal();
        }
        
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, 'user');
            input.value = '';
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                addMessage(data.response, 'ai');
            } catch (error) {
                addMessage('⚠️ CONNECTION ERROR', 'ai');
            }
        }
        
        function handleChatKey(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        function addMessage(text, sender) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        async function clearChat() {
            try {
                await fetch('/api/chat/clear', { method: 'POST' });
                document.getElementById('chatMessages').innerHTML = `
                    <div class="message ai">
                        > CHAT CLEARED<br>
                        > READY FOR NEW GAME<br>
                        > DISCUSS 👾
                    </div>
                `;
            } catch (error) {
                console.error('Error clearing chat:', error);
            }
        }
        
        window.onclick = function(event) {
            const modal = document.getElementById('gameModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
